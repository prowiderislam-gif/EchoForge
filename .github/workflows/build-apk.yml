name: Build EchoForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout EchoForge
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Android project
        run: |
          if [ ! -f "android/gradlew" ]; then
            flutter create /tmp/echoforge_android \
              --platforms=android \
              --project-name=echoforge

            rsync -a \
              --exclude="app/src/main/AndroidManifest.xml" \
              --exclude="app/src/main/kotlin/com/example/echoforge/MainActivity.kt" \
              /tmp/echoforge_android/android/ \
              android/
          fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze Dart project
        run: dart analyze --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EchoForge-APK
          path: build/app/outputs/flutter-apk/app-release.apk
